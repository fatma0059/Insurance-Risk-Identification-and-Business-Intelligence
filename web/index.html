<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTREE Assurances - Connexion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>ASTREE Assurances</h1>
                <p class="subtitle">Plateforme de gestion</p>
            </div>
            
            <div class="login-form">
                <h2>Connexion</h2>
                
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="exemple@astree.ma" value="admin@astree.ma">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Mot de passe
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" value="astreeadmin">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
                
                <div id="error-message" class="login-error"></div>
                
                <div class="login-info">
                    <p><strong>🔑 Identifiants de test :</strong></p>
                    <p>📧 <strong>Admin :</strong> admin@astree.ma / astreeadmin</p>
                    <p>📧 <strong>Agent :</strong> agent@astree.ma / astreeagent</p>
                </div>
            </div>
        </div>
        
        <div class="login-footer">
            <p>&copy; 2026 ASTREE Assurances. Tous droits réservés.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
